    <style>
      .leaflet-container { font-family: inherit; }
      .fishing-map-popup .leaflet-popup-content-wrapper {
        background: #1e293b;

        border: 1px solid rgba(59, 130, 246, 0.3);

      }
      .fishing-map-popup .leaflet-popup-tip {
        background: #1e293b;
        border: 1px solid rgba(59, 130, 246, 0.3);

      .fishing-map-popup .leaflet-popup-content {
        margin: 12px 16px;
        line-height: 1.5;
      }
      .fishing-map-popup .leaflet-popup-close-button {
        color: #94a3b8 !important;
        font-size: 18px !important;

        right: 8px !important;
      }
      .fishing-map-popup .leaflet-popup-close-button:hover {
        color: white !important;
      }
      .marker-cluster-small {

        color: white !important;

        color: white !important;
        font-weight: 600;
      }

        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.8);
        border: 3px solid white;
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5);
        animation: pulse-ring 2s infinite;
      }
      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
        70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
